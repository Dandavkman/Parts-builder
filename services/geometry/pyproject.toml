[project]
name = "geometry"
version = "0.0.0"
description = "Stateless geometry service for Parts Builder: scan processing, Part Spec builds, checks."
requires-python = ">=3.12"
dependencies = ["jsonschema"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "types-jsonschema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geometry"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
