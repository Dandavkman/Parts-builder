[project]
name = "geometry"
version = "0.0.0"
description = "Stateless geometry service for Parts Builder: scan processing, Part Spec builds, checks."
requires-python = ">=3.12"
dependencies = [
    "cadquery>=2.8.0",
    "fastapi>=0.161.0",
    "jsonschema",
    "numpy>=2.5.4",
    "trimesh>=5.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-jsonschema",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geometry"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["cadquery.*", "OCP.*", "trimesh.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
