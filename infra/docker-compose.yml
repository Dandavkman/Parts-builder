# Local development services. Start with `pnpm dev:setup`.
name: parts-builder

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: parts
      POSTGRES_PASSWORD: parts_dev_password
      POSTGRES_DB: parts_builder
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parts -d parts_builder"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
